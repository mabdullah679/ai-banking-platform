# SLO: 99.5% of requests succeed (not 5xx) over 30 days, so the error budget is 0.5%.
# Health, readiness and metrics requests are left out so probes do not hide real failures.
groups:
  - name: slo-recording
    rules:
      - record: slo:http_error_ratio:rate5m
        expr: |
          sum by (job) (rate(http_requests_total{status=~"5..",path!~"/metrics|/health|/ready"}[5m]))
          / sum by (job) (rate(http_requests_total{path!~"/metrics|/health|/ready"}[5m]))
      - record: slo:http_error_ratio:rate30m
        expr: |
          sum by (job) (rate(http_requests_total{status=~"5..",path!~"/metrics|/health|/ready"}[30m]))
          / sum by (job) (rate(http_requests_total{path!~"/metrics|/health|/ready"}[30m]))
      - record: slo:http_error_ratio:rate1h
        expr: |
          sum by (job) (rate(http_requests_total{status=~"5..",path!~"/metrics|/health|/ready"}[1h]))
          / sum by (job) (rate(http_requests_total{path!~"/metrics|/health|/ready"}[1h]))
      - record: slo:http_error_ratio:rate6h
        expr: |
          sum by (job) (rate(http_requests_total{status=~"5..",path!~"/metrics|/health|/ready"}[6h]))
          / sum by (job) (rate(http_requests_total{path!~"/metrics|/health|/ready"}[6h]))
      - record: slo:http_latency_p95:rate5m
        expr: |
          histogram_quantile(0.95, sum by (job, le) (
            rate(http_request_duration_seconds_bucket{path!~"/metrics|/health|/ready"}[5m])))

  - name: slo-alerts
    rules:
      # Burning the 30 day budget 14.4x too fast: the whole budget would be gone in about 2 days.
      - alert: SLOFastBurn
        expr: slo:http_error_ratio:rate1h > (14.4 * 0.005) and slo:http_error_ratio:rate5m > (14.4 * 0.005)
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.job }} is burning its error budget 14.4x too fast"
      # Burning 6x too fast over 6 hours: the budget would be gone in about 5 days. Ticket, not page.
      - alert: SLOSlowBurn
        expr: slo:http_error_ratio:rate6h > (6 * 0.005) and slo:http_error_ratio:rate30m > (6 * 0.005)
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.job }} is burning its error budget 6x too fast"
      - alert: HighLatencyP95
        expr: slo:http_latency_p95:rate5m > 0.3
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: "{{ $labels.job }} p95 latency is above 300 ms"

  - name: platform-alerts
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: "{{ $labels.job }} cannot be scraped"
      - alert: NoModelLoaded
        expr: absent(model_loaded_info{job="model-server"})
        for: 5m
        labels: {severity: page}
        annotations:
          summary: "The model server has no live model"
      - alert: BadModelVersionRefused
        expr: model_reload_errors > 0
        labels: {severity: ticket}
        annotations:
          summary: "A broken model version was refused; the old version is still serving"
      - alert: QuotaRejectionsHigh
        expr: sum by (team) (increase(platform_jobs_submitted_total{result="rejected_quota"}[1h])) > 10
        labels: {severity: info}
        annotations:
          summary: "Team {{ $labels.team }} keeps hitting its quota; maybe it needs more"
