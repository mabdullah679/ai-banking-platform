# Platform namespace: nothing connects in unless allowed below (default deny).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: platform}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Teams may call the model server (inference) and nothing else in the platform namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: teams-to-model-server, namespace: platform}
spec:
  podSelector: {matchLabels: {app: model-server}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchExpressions: [{key: platform/team, operator: Exists}]}
      ports: [{port: 8000}]
---
# Prometheus (in a "monitoring" namespace) may scrape both platform services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: prometheus-scrape, namespace: platform}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      ports: [{port: 8000}]
---
# The platform API is reached through the ingress controller's namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ingress-to-platform-api, namespace: platform}
spec:
  podSelector: {matchLabels: {app: platform-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress}}
      ports: [{port: 8000}]
